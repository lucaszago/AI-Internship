# Week 3 ops agent — separate Render service from Session 1/2 RAG.
# Blueprint path: render.agent.yaml (leave root render.yaml for week1v2-ask-api-public).
services:
  - type: web
    name: week3-ops-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python week3_agent/agent/seed_demo_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /agent/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ROOT_UI
        value: agent
      - key: AGENT_MODEL
        value: gemini-3.6-flash
      - key: AGENT_MAX_STEPS
        value: "8"
      # Optional: RAG still works on this process if you set these too
      - key: PINECONE_INDEX_NAME
        value: document-chunks
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
