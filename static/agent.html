<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ops revenue analyst</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14181d;
        --panel-2: #1c2128;
        --line: #2a313a;
        --text: #f4f6f8;
        --muted: #9aa4b2;
        --accent: #3dd68c;
        --think: #f5c14a;
        --act: #6cb6ff;
        --observe: #c4b5fd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(1000px 480px at 90% -10%, #0d2a1c 0%, transparent 55%),
          var(--bg);
        color: var(--text);
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 700;
      }
      h1 {
        margin: 8px 0;
        font-size: 34px;
        letter-spacing: -0.03em;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 28px;
        max-width: 68ch;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .ghost {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .primary {
        background: var(--accent);
        color: #04140c;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .step {
        border-left: 3px solid var(--line);
        padding: 10px 12px;
        margin: 8px 0;
        background: var(--panel-2);
        border-radius: 0 10px 10px 0;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.45;
      }
      .step.Think { border-color: var(--think); }
      .step.Act { border-color: var(--act); }
      .step.Observe { border-color: var(--observe); }
      .label {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: var(--muted);
      }
      .answer {
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .error { color: #ff8a7a; }
      .muted { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Week 3 · Google ADK</div>
      <h1>Ops revenue analyst</h1>
      <p class="lede">
        Ask a sales/ops question. The agent runs real SQL via <code>run_sql</code>
        and shows <strong>Think → Act → Observe</strong>, then a KPI brief.
      </p>

      <section class="card">
        <label for="q">Manager question</label>
        <textarea id="q">Which city has the highest total completed-order revenue?</textarea>
        <div class="actions">
          <button class="ghost" type="button" id="healthBtn">Health</button>
          <button class="primary" type="button" id="runBtn">Run agent</button>
        </div>
        <p class="muted" id="status"></p>
      </section>

      <section class="card">
        <h2 style="margin:0 0 12px;font-size:18px">Think → Act → Observe</h2>
        <div id="steps" class="muted">Run the agent to see steps.</div>
      </section>

      <section class="card">
        <h2 style="margin:0 0 12px;font-size:18px">Final answer</h2>
        <div id="answer" class="answer muted">—</div>
      </section>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const stepsEl = document.getElementById("steps");
      const answerEl = document.getElementById("answer");
      const runBtn = document.getElementById("runBtn");
      const healthBtn = document.getElementById("healthBtn");

      healthBtn.addEventListener("click", async () => {
        statusEl.textContent = "Checking /agent/health…";
        try {
          const res = await fetch("/agent/health");
          const data = await res.json();
          statusEl.textContent = JSON.stringify(data);
        } catch (err) {
          statusEl.innerHTML = `<span class="error">${err}</span>`;
        }
      });

      runBtn.addEventListener("click", async () => {
        const question = document.getElementById("q").value.trim();
        if (!question) {
          statusEl.innerHTML = '<span class="error">Enter a question.</span>';
          return;
        }
        runBtn.disabled = true;
        statusEl.textContent = "Agent running…";
        stepsEl.innerHTML = "";
        answerEl.textContent = "—";
        answerEl.classList.add("muted");
        try {
          const res = await fetch("/agent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || res.statusText);
          }
          stepsEl.innerHTML = (data.steps || [])
            .map(
              (s) =>
                `<div class="step ${s.label}"><div class="label">${s.label}</div>${escapeHtml(
                  s.detail
                )}</div>`
            )
            .join("") || '<p class="muted">No steps returned.</p>';
          answerEl.textContent = data.answer || "(empty)";
          answerEl.classList.remove("muted");
          statusEl.textContent = "Done.";
        } catch (err) {
          statusEl.innerHTML = `<span class="error">${escapeHtml(String(err.message || err))}</span>`;
        } finally {
          runBtn.disabled = false;
        }
      });

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }
    </script>
  </body>
</html>
