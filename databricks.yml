bundle:
  name: question-answer-demo-app

variables:
  bundle_owner:
    description: Workspace user that owns bundle artifacts (must match app owner)
    default: lukaszago@hotmail.com

resources:
  apps:
    ask_ui:
      name: week1v2-ask-ui
      source_code_path: .
      description: Structured Q&A API with same-origin web UI
      resources:
        - name: openai_api_key
          secret:
            scope: week1v2
            key: openai_api_key
            permission: READ
        - name: document_chunks_index
          uc_securable:
            securable_type: TABLE
            securable_full_name: workspace.document_retrieval.document_chunks_index
            permission: SELECT
        - name: document_chunks_table
          uc_securable:
            securable_type: TABLE
            securable_full_name: workspace.document_retrieval.document_chunks
            permission: MODIFY
      config:
        command:
          - python
          - main.py
        env:
          - name: OPENAI_API_KEY
            value_from: openai_api_key
          - name: RAG_CATALOG
            value: workspace
          - name: RAG_SCHEMA
            value: document_retrieval
          - name: RAG_TABLE
            value: document_chunks
          - name: VECTOR_SEARCH_ENDPOINT
            value: document-chunks-search-endpoint
          - name: VECTOR_SEARCH_INDEX
            value_from: document_chunks_index
          - name: EMBEDDING_MODEL
            value: text-embedding-3-small
          - name: EMBEDDING_DIMENSIONS
            value: "1536"
          - name: RAG_CHUNK_SIZE
            value: "800"
          - name: RAG_CHUNK_OVERLAP
            value: "100"
          - name: RAG_TOP_K
            value: "5"

targets:
  prod:
    mode: production
    workspace:
      host: https://dbc-d3858b75-976f.cloud.databricks.com
      root_path: /Workspace/Users/${var.bundle_owner}/.bundle/${bundle.name}/${bundle.target}
